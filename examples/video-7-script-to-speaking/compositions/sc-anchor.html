<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: visible;
        }
        .sa-veil {
          position: absolute;
          inset: 0;
          background: linear-gradient(180deg, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0.04) 45%, rgba(255, 255, 255, 0) 100%);
        }
        .sa-s {
          position: absolute;
          left: 22px;
          height: 66px;
          padding-left: 62px;
          border-radius: 16px;
          font: 500 35px FigK, sans-serif;
          letter-spacing: -0.012em;
          line-height: 66px;
          color: #1d2026;
          white-space: nowrap;
        }
        .sa-s .lift {
          position: absolute;
          inset: 0;
          border-radius: 16px;
          background: rgba(255, 255, 255, 0.92);
          box-shadow: 0 14px 30px rgba(20, 40, 80, 0.16);
        }
        .sa-s .tx {
          position: relative;
        }
        .sa-s .w {
          position: relative;
          border-radius: 6px;
        }
        .sa-s .wb {
          position: absolute;
          left: -5px;
          right: -5px;
          top: 6px;
          bottom: 4px;
          border: 2.5px solid #e5484d;
          border-radius: 6px;
          background: rgba(229, 72, 77, 0.08);
        }
        .sa-s .ck {
          position: absolute;
          left: 14px;
          top: 13px;
          width: 40px;
          height: 40px;
        }
        .sa-ring {
          position: absolute;
          left: 1110px;
          top: 550px;
          width: 300px;
          height: 300px;
          margin: -150px 0 0 -150px;
          border-radius: 50%;
          border: 4px solid rgba(49, 112, 228, 0.7);
        }
        .sa-dot {
          position: absolute;
          left: 0;
          top: 0;
          width: 26px;
          height: 26px;
          margin: -13px 0 0 -13px;
          border-radius: 50%;
          background: #3170e4;
          border: 4px solid #ffffff;
          box-shadow: 0 6px 14px rgba(49, 112, 228, 0.4);
        }
      </style>

      <div id="root" data-composition-id="sc-anchor" data-width="1440" data-height="1080">
        <div id="sa-wrap" style="position: absolute; inset: 0"></div>
      </div>

      <script>
        (function () {
          /* "rather than remembering a whole segment, you can just remember certain sentences and just try to speak in
             front of the camera, rather than just reading word by word". Read ONE sentence, look up, say it to the
             camera; then the next. The script is a frosted doc; the camera is a live window of you (#pv-cam).
             The whole segment gets selected → the selection snaps to one sentence → it lifts, travels to the camera,
             gets said ✓. Then the wrong way, for contrast: word… by… word, eyes on the page. */
          const K = window.HFKit;
          const el = K.el;
          const tl = gsap.timeline({ paused: true });
          const W = document.getElementById("sa-wrap");
          const O = 79.5;
          const T = (g) => +(g - O).toFixed(2);

          const veil = el("div", "sa-veil", W);
          tl.fromTo(veil, { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, T(79.7));
          K.text(tl, W, { x: 100, y: 64, a: "tl", lines: [{ s: 66, w: [["rather than", T(80.02)], ["remembering", T(80.2)]] }, { s: 140, w: [["a whole", T(81.32)], ["segment", T(81.56), "s", "m"]] }], out: T(83.28), outMode: "fade" });
          K.text(tl, W, { x: 100, y: 64, a: "tl", lines: [{ s: 66, w: [["you can just", T(83.32)], ["remember", T(83.66)]] }, { s: 140, w: [["certain", T(84.34)], ["sentences", T(84.6), "s", "m"]] }], out: T(85.98), outMode: "fade" });
          K.text(tl, W, { x: 100, y: 64, a: "tl", lines: [{ s: 66, w: [["just try to", T(86.04)]] }, { s: 140, w: [["speak", T(86.48), "s", "m"], ["it", T(86.6)]] }], out: T(87.6), outMode: "fade" });
          K.text(tl, W, { x: 100, y: 64, a: "tl", lines: [{ s: 66, w: [["rather than just", T(87.64)], ["reading", T(88.92)]] }, { s: 140, w: [["word", T(89.88), "s", "m"], ["by", T(90.54)], ["word", T(90.7)]] }], out: T(90.95), outMode: "fade" });

          // the script: this video's own lines, one per row
          const C = { x: 72, y: 352, w: 720, h: 508 };
          const doc = K.fcard(W, C);
          tl.fromTo(doc.box, { opacity: 0, scale: 0.9, y: 40, filter: "blur(14px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out" }, T(79.8));
          tl.set(doc.box, { filter: "none" }, T(80.55));
          const hd = el("div", "fz-hd", doc.inner);
          hd.style.left = "30px";
          hd.style.top = "26px";
          hd.innerHTML = K.iconSvg("doc").replace("<svg ", '<svg width="28" height="28" fill="none" stroke="rgba(28,32,40,0.55)" stroke-width="2" ') + "script.txt · <em>this video</em>";
          const LINES = ["You wrote a perfect script.", "Recorded, it feels unnatural.", "Content is communication.", "Write it, then speak it slowly."];
          const SY = [92, 180, 268, 356]; // row tops inside the panel
          const SW = C.w - 28 - 44;
          const rows = LINES.map((s, i) => {
            const r = el("div", "sa-s", doc.inner);
            r.style.top = SY[i] + "px";
            r.style.width = SW + "px";
            const lift = el("div", "lift", r);
            const ck = el("div", "ck", r);
            ck.innerHTML = '<svg viewBox="0 0 34 34" width="40" height="40"><circle cx="17" cy="17" r="12.5" fill="#3170e4"/><path d="m11.6 17.3 3.8 3.8 7.2-7.4" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
            const tx = el("span", "tx", r);
            const words = s.split(" ").map((w, k) => {
              const sp = el("span", "w", tx);
              sp.textContent = w;
              if (k < s.split(" ").length - 1) tx.appendChild(document.createTextNode(" "));
              return sp;
            });
            tl.set([lift, ck], { opacity: 0 }, 0);
            tl.fromTo(r, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, T(80.0) + i * 0.08);
            return { r, lift, ck, words };
          });
          const sx = C.x + 14 + 22,
            sy = (i) => C.y + 14 + SY[i]; // a row's top-left on screen

          // the camera: a live window of you (index.html #pv-cam: centre 1110, 550 · 300 px)
          const CX = 1110,
            CY = 550;
          const rec = K.fchip(tl, W, { x: CX, y: CY + 200, a: "c", text: "REC", dot: true, t: T(80.5) });
          const speak = K.fchip(tl, W, { x: CX, y: CY + 200, a: "c", text: "look up · say it", cls: "blue" });
          const eyes = K.fchip(tl, W, { x: CX, y: CY + 200, a: "c", text: "eyes on the page", dot: true });

          // "remembering a whole segment of content": all of it selected, all of it to carry
          const you = K.fcursor(tl, W, { name: "you", color: "#3170e4", x: 820, y: 900 });
          const sel = K.fsel(tl, W, { x: sx - 10, y: sy(0) - 10, w: SW + 20, h: SY[3] - SY[0] + 66 + 20 });
          sel.show(T(80.3));
          you.show(T(80.2));
          you.moveTo(sx + SW + 4, sy(3) + 70, T(80.25), 0.6);
          rows.forEach((o, i) => tl.to(o.r, { backgroundColor: "rgba(49,112,228,0.1)", duration: 0.3, ease: "power2.out" }, T(80.4) + i * 0.1));
          const whole = K.fchip(tl, W, { x: sx + SW + 10, y: sy(0) - 46, a: "r", text: "whole segment", dot: true, t: T(81.56) });

          // "you can just remember certain sentences": the selection snaps to one sentence, the rest steps back
          sel.to({ x: sx - 10, y: sy(0) - 8, w: SW + 20, h: 82 }, T(83.5), 0.6);
          you.moveTo(sx + SW + 4, sy(0) + 66, T(83.5), 0.6);
          tl.to(whole, { opacity: 0, filter: "blur(6px)", duration: 0.25, ease: "power1.in" }, T(83.4));
          rows.forEach((o, i) => {
            tl.to(o.r, { backgroundColor: "rgba(49,112,228,0)", duration: 0.3, ease: "power2.out" }, T(83.5));
            if (i > 0) tl.to(o.r, { opacity: 0.32, filter: "blur(1.5px)", duration: 0.45, ease: "power2.out" }, T(84.34));
          });

          // "and just try to speak in front of the camera": that sentence lifts, travels to the camera, gets said
          const svg = K.fsvg(W, 1440, 1080);
          const loop = (i, tRead, tSpeak, tDone) => {
            const o = rows[i];
            tl.to(o.lift, { opacity: 1, duration: 0.35, ease: "power2.out" }, tRead);
            tl.to(o.r, { scale: 1.035, opacity: 1, filter: "blur(0px)", duration: 0.45, ease: "power3.out", transformOrigin: "30% 50%" }, tRead);
            const y = sy(i) + 33;
            const path = [
              [sx + SW + 6, y],
              [880, y],
              [880, CY],
              [CX - 160, CY],
            ];
            const ln = K.flink(tl, svg, { pts: path, dash: true, dot0: true, r: 22, t: tSpeak - 0.25, d: 0.45 });
            const dot = el("div", "sa-dot", W);
            tl.set(dot, { x: path[0][0], y: path[0][1], opacity: 0 }, 0);
            tl.to(dot, { opacity: 1, duration: 0.15 }, tSpeak);
            tl.to(dot, { keyframes: [{ x: path[1][0], duration: 0.18 }, { y: path[2][1], duration: 0.22 }, { x: path[3][0], duration: 0.2 }], ease: "none" }, tSpeak);
            tl.to(dot, { opacity: 0, scale: 0.5, duration: 0.15 }, tSpeak + 0.58);
            // the camera hears it: two soft rings
            [0, 0.32].forEach((d) => {
              const ring = el("div", "sa-ring", W);
              tl.set(ring, { opacity: 0 }, 0);
              tl.fromTo(ring, { opacity: 0.9, scale: 1 }, { opacity: 0, scale: 1.32, duration: 0.9, ease: "power2.out", immediateRender: false }, tSpeak + 0.6 + d);
            });
            tl.to(o.ck, { opacity: 1, duration: 0.01 }, tDone);
            tl.fromTo(o.ck, { scale: 0.4 }, { scale: 1, duration: 0.45, ease: "expo.out", immediateRender: false }, tDone);
            tl.to(o.lift, { opacity: 0, duration: 0.35, ease: "power2.out" }, tDone + 0.1);
            tl.to(o.r, { scale: 1, color: "#1f4ca8", duration: 0.4, ease: "power3.out" }, tDone + 0.1);
            tl.to(ln.g, { opacity: 0, duration: 0.3, ease: "power1.in" }, tDone + 0.25);
          };
          tl.set([speak, eyes], { opacity: 0 }, 0);
          tl.to(rec, { opacity: 0, duration: 0.2 }, T(86.36));
          tl.fromTo(speak, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, T(86.48));
          loop(0, T(85.3), T(86.48), T(87.34));

          // "rather than just reading word by word": the wrong way — the selection crawls word by word, eyes down
          sel.hide(T(87.7));
          you.hide(T(87.7));
          tl.to(rows[1].r, { opacity: 1, filter: "blur(0px)", duration: 0.35, ease: "power2.out" }, T(88.6));
          const WB = rows[1].words.map((w) => {
            const b = el("span", "wb", w);
            tl.set(b, { opacity: 0 }, 0);
            return b;
          });
          [T(88.92), T(89.88), T(90.54), T(90.7)].forEach((t, k) => {
            if (k > 0) tl.set(WB[k - 1], { opacity: 0 }, t);
            tl.fromTo(WB[k], { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power2.out", immediateRender: false }, t);
          });
          tl.to(speak, { opacity: 0, duration: 0.2 }, T(88.85));
          tl.fromTo(eyes, { opacity: 0, scale: 0.86 }, { opacity: 1, scale: 1, duration: 0.4, ease: "expo.out", immediateRender: false }, T(88.95));

          tl.to(W, { opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power1.in" }, T(90.7));

          window.__timelines["sc-anchor"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
