<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: visible;
        }
      </style>

      <div id="root" data-composition-id="ov-behind" data-width="1440" data-height="1080">
        <div class="stage3d" id="obh-stage"></div>
      </div>

      <script>
        (function () {
          const K = window.HFKit;
          const tl = gsap.timeline({ paused: true });
          const S = document.getElementById("obh-stage");
          /* hero words in the sky BEHIND your head (your matte is layered on top of this comp); each leaves before its matte ends */
          K.text(tl, S, { shot: "s3", x: 720, y: 150, a: "tc", lines: [{ s: 240, w: [["perfect", 12.2]] }], out: 13.15, outMode: "fade" });
          K.text(tl, S, { shot: "s11", x: 1010, y: 170, a: "tc", lines: [{ s: 220, w: [["easier", 78.34]] }], out: 79.15, outMode: "fade" });
          K.text(tl, S, { shot: "s14", x: 720, y: 160, a: "tc", lines: [{ s: 290, w: [["done", 96.6]] }], out: 97.45, outMode: "fade" });
          window.__timelines["ov-behind"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
