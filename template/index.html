<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=960, height=720" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "SerifK";
        src: url("assets/fonts/instrument-serif.woff2") format("woff2");
        font-weight: 400;
      }
      @font-face {
        font-family: "InterK";
        src: url("assets/fonts/inter-800.woff2") format("woff2");
        font-weight: 800;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 960px;
        height: 720px;
        overflow: hidden;
        background: #0b0b0b;
      }
      #stage {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: #0b0b0b;
        font-family: "Inter", sans-serif;
      }
      /* everything is authored in a 1440x1080 world; OUTPUT_SCALE maps it to the render size
         (0.6667 → 960x720 draft · 1 → 1440x1080 · 2 → 2880x2160 4K). Set by tools/set_output.py */
      #world {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1080px;
        transform-origin: 0 0;
        transform: scale(0.6666667);
        perspective: 2400px;
      }

      /* ---------- camera: footage + world-locked text/overlays ---------- */
      #cam {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1080px;
      }
      #punch {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1080px;
      }
      /* face tracking: the footage and your cut-outs follow your face (captions and cards stay put in the frame) */
      .trk {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1080px;
      }
      /* every A-roll segment shares the same 4:3 crop as its matte clip */
      video[id^="aroll-"] {
        position: absolute;
        left: -240px;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      .ovhost,
      .schost {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 1080px;
      }
      .matte {
        position: absolute;
        left: -240px;
        top: 0;
        width: 1920px;
        height: 1080px;
        object-fit: cover;
      }
      #vignette {
        position: absolute;
        left: -240px;
        top: 0;
        width: 1920px;
        height: 1080px;
        pointer-events: none;
        background: none; /* the footage grade carries its own vignette */
      }

      /* ---------- kinetic type (matched to the inspo) ----------
         Inter Bold, very tight tracking, overlapping lines.
         White: flat warm white + soft drop shadow. Blue: soft sky blue, slightly lighter at the top. */
      .stage3d {
        position: absolute;
        inset: 0;
        perspective: 1250px;
      }
      .kg {
        position: absolute;
        display: flex;
        flex-direction: column;
        font-family: "InterK", "Inter", sans-serif;
        font-weight: 800;
        letter-spacing: -0.05em;
        line-height: 0.84;
        white-space: nowrap;
      }
      .kg.al-l {
        align-items: flex-start;
      }
      .kg.al-c {
        align-items: center;
      }
      .kg.al-r {
        align-items: flex-end;
      }
      .kl {
        display: block;
        position: relative;
      }
      .kw {
        display: inline-block;
        margin-right: 0.16em;
      }
      .kw:last-child {
        margin-right: 0;
      }
      .kt {
        display: inline-block;
        /* padding keeps the gradient clip from cropping glyphs; equal negative margin keeps lines tightly overlapped */
        padding: 0.08em 0.02em 0.14em;
        margin: -0.08em -0.02em -0.14em;
      }
      /* CAPTION COLOUR — decide per take on real frames (references/01 §4). Default here: bright/mid-blue sky → INK with a soft white halo;
         accent words keep the user's blue, set on a WHITE highlighter swipe so they pop off a blue sky. */
      .c-w .kt {
        color: #111214;
        text-shadow:
          0 0 0.14em rgba(255, 255, 255, 0.6),
          0 0.03em 0.06em rgba(255, 255, 255, 0.4);
      }
      /* DARK footage behind the text (trees, a dark shirt, indoor): swap to warm white —
         .c-w .kt { color: #f6f3f2; text-shadow: 0 0.012em 0 rgba(176,178,188,.75), 0 0.045em 0.08em rgba(0,0,0,.45), 0 1px 2px rgba(0,0,0,.3); }
         and use the soft sky blue #7eb2ea for accents. Single words over trees in an ink video: `word^x` in captions.py. */
      .c-i .kt {
        color: #111214;
      }
      .c-b .kt,
      .c-l .kt,
      .c-y .kt,
      .c-p .kt {
        /* accent: the jersey's royal blue, a touch lighter than cobalt (the user found cobalt too deep) */
        color: #3170e4;
        background: linear-gradient(180deg, #3f7cee 0%, #3170e4 60%, #2a66da 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: none;
      }
      /* white is kept for words that land on the trees or the shirt */
      .c-x .kt {
        color: #f6f3f2;
        text-shadow:
          0 0.012em 0 rgba(176, 178, 188, 0.75),
          0 0.045em 0.08em rgba(0, 0, 0, 0.45),
          0 1px 2px rgba(0, 0, 0, 0.3);
      }
      /* B-roll type: one emotional word per headline in the serif italic, with a highlighter swipe behind it */
      .c-s .kt {
        font-family: "SerifK", Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.01em;
        color: #3170e4;
        text-shadow: none;
      }
      .dark .c-s .kt {
        color: #8fb4f6;
      }
      .kw.mk {
        position: relative;
        isolation: isolate;
      }
      .kw .mkb {
        position: absolute;
        left: -0.08em;
        right: -0.08em;
        bottom: 0.1em;
        height: 0.4em;
        border-radius: 0.1em;
        background: rgba(49, 112, 228, 0.2);
      }
      /* on the footage the swipe is white: a blue word on a white bar reads on any sky */
      #cam .kw .mkb {
        bottom: 0.04em;
        height: 0.62em;
        background: rgba(255, 255, 255, 0.86);
        box-shadow: 0 0.04em 0.12em rgba(20, 40, 80, 0.12);
        transform-origin: 0% 50%;
        z-index: -1;
      }
      .dark .kw .mkb {
        background: rgba(143, 180, 246, 0.22);
      }
      /* odometer numbers: every digit is a strip that rolls to the next value */
      .roll {
        position: absolute;
        display: flex;
        font-family: "InterK", "Inter", sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
        line-height: 1;
        white-space: nowrap;
      }
      .roll .col {
        position: relative;
        height: 1em;
        overflow: hidden;
      }
      .roll .strip {
        display: flex;
        flex-direction: column;
      }
      .roll .strip span {
        height: 1em;
        text-align: center;
      }
      .cap {
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(236, 239, 245, 0.55);
      }

      /* ---------- flat panels: one surface, one hairline, no sheen or glow ---------- */
      .glass {
        position: absolute;
        border-radius: 22px;
        background: rgba(16, 16, 16, 0.86);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(18px);
        -webkit-backdrop-filter: blur(18px);
        color: #f3f4f7;
        font-family: "Inter", sans-serif;
      }
      .glass.solid {
        background: #141414;
        border-color: rgba(255, 255, 255, 0.1);
        box-shadow: none;
        backdrop-filter: none;
        -webkit-backdrop-filter: none;
      }
      /* focus state: the thing being talked about gets the accent hairline */
      .glass.on,
      .on > .glass {
        border-color: rgba(126, 178, 234, 0.9);
      }
      .ico {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 26%;
      }
      .ico svg {
        width: 52%;
        height: 52%;
        overflow: visible;
      }
      .ico svg * {
        fill: none;
        stroke: #f4f6fa;
        stroke-width: 1.9;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ico.blue {
        background: rgba(126, 178, 234, 0.1);
        border: 1px solid rgba(126, 178, 234, 0.6);
      }
      .ico.blue svg * {
        stroke: #a9cdf3;
      }
      .ico.fill {
        background: #7eb2ea;
        border: none;
      }
      .ico.fill svg * {
        stroke: #0b0b0b;
        stroke-width: 2.4;
      }

      /* ---------- full-screen B-roll stage: flat black, film grain, hairline grid ---------- */
      .gridbg {
        position: absolute;
        inset: 0;
        background-color: #0b0b0b;
        background-image:
          radial-gradient(circle, rgba(255, 255, 255, 0.26) 1.2px, rgba(255, 255, 255, 0) 1.7px),
          linear-gradient(rgba(255, 255, 255, 0.045) 1px, rgba(255, 255, 255, 0) 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.045) 1px, rgba(255, 255, 255, 0) 1px);
        background-size: 120px 120px;
        background-position:
          -60px -60px,
          0 0,
          0 0;
      }
      .gridframe {
        position: absolute;
        left: 40px;
        top: 40px;
        right: 40px;
        bottom: 40px;
        border: 1px solid rgba(255, 255, 255, 0.09);
      }
      .grain {
        position: absolute;
        inset: 0;
        background-image: url("assets/textures/grain.png");
        background-size: 256px 256px;
        opacity: 0.075;
        pointer-events: none;
      }

      /* ---------- paper stage (light scenes): warm off-white, hairline grid, ink type ---------- */
      .paperbg {
        position: absolute;
        inset: 0;
        background-color: #f2f0eb;
        background-image:
          linear-gradient(rgba(20, 20, 20, 0.05) 1px, rgba(20, 20, 20, 0) 1px),
          linear-gradient(90deg, rgba(20, 20, 20, 0.05) 1px, rgba(20, 20, 20, 0) 1px);
        background-size: 120px 120px;
      }
      .paper .grain {
        opacity: 0.045;
      }
      /* ---------- dark stage (user references: near-black, fine grain, dot grid) ---------- */
      .darkbg {
        position: absolute;
        inset: 0;
        background-color: #111214;
      }
      .dots {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(circle, rgba(255, 255, 255, 0.16) 1.3px, rgba(255, 255, 255, 0) 1.8px);
        background-size: 60px 60px;
        background-position: 30px 30px;
      }
      .dark .c-w .kt {
        color: #f4f4f2;
        text-shadow: none;
      }
      .dark .c-b .kt {
        color: #6ea2f7;
        background: none;
        -webkit-text-fill-color: #6ea2f7;
        filter: none;
      }
      .dark .grain {
        opacity: 0.06;
      }
      /* ---------- sky stage (video 4 B-roll): soft white-to-blue light, like the inspo, matched to the sky ---------- */
      .skybg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(60% 55% at 22% 18%, rgba(255, 255, 255, 0.95) 0%, rgba(255, 255, 255, 0) 70%),
          radial-gradient(70% 60% at 85% 95%, rgba(96, 152, 236, 0.75) 0%, rgba(96, 152, 236, 0) 70%),
          radial-gradient(55% 50% at 100% 0%, rgba(140, 186, 245, 0.7) 0%, rgba(140, 186, 245, 0) 70%),
          linear-gradient(160deg, #f4f8fe 0%, #dce9fb 55%, #b9d3f6 100%);
      }
      .paper .gridframe {
        border-color: rgba(20, 20, 20, 0.08);
      }
      .paper .c-w .kt,
      .paper .c-i .kt {
        color: #151515;
        text-shadow: none;
      }
      .paper .c-b .kt {
        color: #3a78ec;
        background: linear-gradient(180deg, #4a86f2 0%, #3170e4 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: none;
      }
      .paper .cap {
        color: rgba(20, 20, 20, 0.5);
      }

      /* ---------- frosted liquid glass: only for panels that sit on the footage ---------- */
      .frost {
        position: absolute;
        border-radius: 30px;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.16) 0%, rgba(255, 255, 255, 0.05) 45%, rgba(255, 255, 255, 0.09) 100%);
        border: 1px solid rgba(255, 255, 255, 0.26);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.42),
          inset 0 -1px 0 rgba(255, 255, 255, 0.06),
          0 30px 70px rgba(0, 0, 0, 0.35);
        backdrop-filter: blur(26px) saturate(150%) brightness(0.86);
        -webkit-backdrop-filter: blur(26px) saturate(150%) brightness(0.86);
        color: #f3f4f7;
        font-family: "Inter", sans-serif;
      }

      /* ---------- light liquid glass: panels that float over the bright outdoor footage ---------- */
      .frostl {
        position: absolute;
        border-radius: 30px;
        background: linear-gradient(150deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.78) 55%, rgba(255, 255, 255, 0.86) 100%);
        border: 1px solid rgba(255, 255, 255, 0.85);
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          0 26px 60px rgba(20, 30, 40, 0.28);
        backdrop-filter: blur(24px) saturate(160%);
        -webkit-backdrop-filter: blur(24px) saturate(160%);
        color: #111214;
        font-family: "Inter", sans-serif;
      }
      .frostl .cap,
      .paper .cap {
        color: rgba(17, 18, 20, 0.5);
      }
      .frostl .ico svg *,
      .paper .ico svg * {
        stroke: #111214;
      }
      .frostl .ico.blue,
      .paper .ico.blue {
        background: rgba(29, 95, 214, 0.1);
        border: 1px solid rgba(29, 95, 214, 0.45);
      }
      .frostl .ico.blue svg *,
      .paper .ico.blue svg * {
        stroke: #1d5fd6;
      }
      .ico.fill {
        background: #1d5fd6;
      }
      .ico.fill svg *,
      .frostl .ico.fill svg *,
      .paper .ico.fill svg * {
        stroke: #ffffff;
      }
      /* paper cards: white, one hairline, a soft drop */
      .card {
        position: absolute;
        border-radius: 26px;
        background: #ffffff;
        border: 1px solid rgba(20, 20, 20, 0.08);
        box-shadow: 0 24px 60px rgba(30, 30, 30, 0.09);
        color: #111214;
        font-family: "Inter", sans-serif;
      }
      @font-face {
        font-family: "FigK";
        src: url("assets/fonts/figtree-500.woff2") format("woff2");
        font-weight: 500;
      }
      @font-face {
        font-family: "FigK";
        src: url("assets/fonts/figtree-700.woff2") format("woff2");
        font-weight: 700;
      }
      @font-face {
        font-family: "FigK";
        src: url("assets/fonts/figtree-800.woff2") format("woff2");
        font-weight: 800;
      }

      /* ---------- frosted flow: ONE interface system per video, drawn from the user's reference set ----------
         a translucent card (frosted rim + see-through panel), step pills that go todo → running → done,
         dark state labels on dashed connectors, toggles, a named cursor, a selection box, photo nodes.
         Everything is see-through glass: the sky and the trees blur through it. */
      .fz {
        position: absolute;
        border-radius: 40px;
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.3) 0%, rgba(255, 255, 255, 0.12) 100%);
        border: 1.5px solid rgba(255, 255, 255, 0.6);
        box-shadow:
          inset 0 1.5px 0 rgba(255, 255, 255, 0.8),
          0 30px 70px rgba(20, 40, 80, 0.18);
        backdrop-filter: blur(22px) saturate(1.45);
        -webkit-backdrop-filter: blur(22px) saturate(1.45);
      }
      .fz-in {
        position: absolute;
        inset: 14px;
        border-radius: 28px;
        background: linear-gradient(170deg, rgba(252, 252, 250, 0.62) 0%, rgba(246, 248, 250, 0.46) 100%);
        border: 1px solid rgba(255, 255, 255, 0.75);
      }
      .fz-hd {
        position: absolute;
        display: flex;
        align-items: center;
        gap: 12px;
        font: 700 25px FigK, sans-serif;
        letter-spacing: -0.01em;
        color: rgba(28, 32, 40, 0.55);
        white-space: nowrap;
      }
      .fz-hd em {
        font: italic 400 33px SerifK, Georgia, serif;
        color: #2c5fc4;
      }
      .fk-svg {
        position: absolute;
        left: 0;
        top: 0;
        overflow: visible;
        pointer-events: none;
      }
      /* a step: centred on the flow's spine; layers cross-fade between states */
      .fp {
        position: absolute;
        height: 84px;
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 0 32px 0 24px;
        border-radius: 26px;
        font: 700 35px FigK, sans-serif;
        letter-spacing: -0.012em;
        color: #4d5562;
        white-space: nowrap;
      }
      .fp > .bg {
        position: absolute;
        inset: 0;
        border-radius: 26px;
      }
      .fp .b-todo {
        border: 2px solid rgba(40, 48, 60, 0.3);
        background: rgba(255, 255, 255, 0.24);
      }
      .fp .b-run {
        background: rgba(255, 255, 255, 0.9);
        border: 1.5px solid rgba(40, 48, 60, 0.12);
        box-shadow: 0 12px 26px rgba(20, 40, 80, 0.12);
      }
      .fp .b-ok {
        background: linear-gradient(180deg, #f3f7ff 0%, #cfe0fe 100%);
        border: 1.5px solid #a9c3f2;
        box-shadow:
          inset 0 1.5px 0 #ffffff,
          0 12px 28px rgba(49, 112, 228, 0.22);
      }
      .fp .b-err {
        background: #17181c;
        box-shadow: 0 14px 30px rgba(10, 12, 20, 0.3);
      }
      .fp .ic {
        position: relative;
        width: 40px;
        height: 40px;
        flex: 0 0 auto;
      }
      .fp .ic > * {
        position: absolute;
        left: 0;
        top: 0;
        width: 40px;
        height: 40px;
      }
      .fp .ic img,
      .fp .ic .av {
        border-radius: 50%;
      }
      .fp .lb {
        position: relative;
        display: grid;
      }
      .fp .lb > span {
        grid-area: 1 / 1;
      }
      .fp .strike {
        position: absolute;
        left: 76px;
        right: 28px;
        top: 41px;
        height: 3px;
        border-radius: 2px;
        background: rgba(40, 48, 60, 0.6);
        transform-origin: 0% 50%;
      }
      .fp .fill {
        position: absolute;
        left: 0;
        bottom: 0;
        height: 6px;
        border-radius: 0 0 26px 26px;
        background: #3170e4;
        transform-origin: 0% 50%;
      }
      /* dark state label (the reference's Enabled / Hover / Disabled tags) */
      .fs {
        position: absolute;
        height: 66px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 26px;
        border-radius: 20px;
        background: #16171b;
        color: #ffffff;
        font: 700 31px FigK, sans-serif;
        letter-spacing: -0.01em;
        white-space: nowrap;
        box-shadow: 0 14px 30px rgba(10, 12, 20, 0.26);
      }
      .fs.lite {
        background: rgba(255, 255, 255, 0.86);
        color: #16171b;
        border: 1.5px solid rgba(255, 255, 255, 0.95);
        box-shadow: 0 12px 26px rgba(20, 40, 80, 0.14);
      }
      .fs.blue {
        background: #3170e4;
        color: #ffffff;
        box-shadow: 0 14px 30px rgba(49, 112, 228, 0.32);
      }
      .fs .dot {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: #ff5a5f;
        flex: 0 0 auto;
      }
      /* a photo node (real frames of you), white ring like the reference's avatars */
      .fa {
        position: absolute;
        border-radius: 50%;
        overflow: hidden;
        border: 6px solid rgba(255, 255, 255, 0.92);
        box-shadow: 0 16px 36px rgba(20, 40, 80, 0.22);
        background: rgba(255, 255, 255, 0.5);
      }
      .fa img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .fa.fi {
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.78);
      }
      .fa.fi svg {
        width: 46%;
        height: 46%;
        fill: none;
        stroke: #2b2f36;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      /* a named cursor and a selection box */
      .fc {
        position: absolute;
        left: 0;
        top: 0;
      }
      .fc svg {
        width: 50px;
        height: 50px;
        display: block;
        filter: drop-shadow(0 4px 6px rgba(10, 20, 40, 0.25));
      }
      .fc .tag {
        position: absolute;
        left: 40px;
        top: 44px;
        padding: 7px 16px;
        border-radius: 12px;
        font: 700 27px FigK, sans-serif;
        color: #ffffff;
        white-space: nowrap;
      }
      .fsel {
        position: absolute;
        left: 0;
        top: 0;
        border: 2.5px solid #3170e4;
        border-radius: 4px;
      }
      .fsel i {
        position: absolute;
        width: 15px;
        height: 15px;
        background: #ffffff;
        border: 2.5px solid #3170e4;
        border-radius: 3px;
      }
      .fsel i:nth-child(1) {
        left: -9px;
        top: -9px;
      }
      .fsel i:nth-child(2) {
        right: -9px;
        top: -9px;
      }
      .fsel i:nth-child(3) {
        left: -9px;
        bottom: -9px;
      }
      .fsel i:nth-child(4) {
        right: -9px;
        bottom: -9px;
      }
      /* toggle (the reference's Bookings / Orders / Leads switches) */
      .ft {
        position: absolute;
        width: 76px;
        height: 44px;
        border-radius: 22px;
        background: rgba(40, 48, 60, 0.2);
      }
      .ft .on {
        position: absolute;
        inset: 0;
        border-radius: 22px;

            <div id="trk-a" class="trk">
              <video data-color-grading="{&quot;preset&quot;:&quot;skin-soft&quot;,&quot;intensity&quot;:0.62,&quot;adjust&quot;:{&quot;exposure&quot;:0.04,&quot;contrast&quot;:0.08,&quot;highlights&quot;:-0.18,&quot;shadows&quot;:0.05,&quot;whites&quot;:0,&quot;blacks&quot;:-0.05,&quot;temperature&quot;:0.06,&quot;tint&quot;:0.02,&quot;vibrance&quot;:0.03,&quot;saturation&quot;:-0.03},&quot;details&quot;:{&quot;vignette&quot;:0.05,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" id="aroll-main" class="clip" src="assets/aroll-cut.mp4" data-start="0" data-duration="60" data-media-start="0" data-track-index="0" playsinline data-has-audio="true"></video>
              <div id="vignette"></div>
            </div>
            <div id="ov-behind" class="ovhost clip" data-composition-id="ov-behind" data-composition-src="compositions/ov-behind.html" data-start="0" data-duration="60" data-track-index="2" data-width="1440" data-height="1080"></div>
            <div id="trk-m" class="trk">
              <!-- one matte clip per hero word (cut out of assets/aroll-cut.mp4 around the word; same grade as the A-roll), e.g.
              <video data-color-grading="(copy from aroll-main)" id="matte-perfect" class="clip matte" src="assets/matte/perfect.webm" data-start="11.95" data-duration="1.25" data-media-start="0" data-track-index="1" playsinline muted></video> -->
            </div>
            <!-- captions ride the camera: one host per stretch of the video (scripts/captions.py fills them) -->
            <div id="ov-a" class="ovhost clip" data-composition-id="ov-a" data-composition-src="compositions/ov-a.html" data-start="0" data-duration="20.1" data-track-index="4" data-width="1440" data-height="1080"></div>
            <div id="ov-b" class="ovhost clip" data-composition-id="ov-b" data-composition-src="compositions/ov-b.html" data-start="27.9" data-duration="32.1" data-track-index="4" data-width="1440" data-height="1080"></div>
          </div>
        </div>
        <!-- the frosted flow: screen-locked cards (fl-*) and rack-focus scenes (sc-*) — one system across the video -->
        <div id="fl-example" class="ovhost clip" data-composition-id="fl-example" data-composition-src="compositions/fl-example.html" data-start="0" data-duration="20.1" data-track-index="5" data-width="1440" data-height="1080"></div>
        <div id="sc-example" class="schost clip" data-composition-id="sc-example" data-composition-src="compositions/sc-example.html" data-start="19.9" data-duration="8.4" data-track-index="6" data-width="1440" data-height="1080"></div>
        <!-- live window: the same take, sharp, inside sc-example's card (keep its rectangle in sync with the scene) -->
        <div id="pv-example" class="portal" style="left: 426px; top: 318px; width: 588px; height: 338px; border-radius: 26px">
          <video data-color-grading="{&quot;preset&quot;:&quot;skin-soft&quot;,&quot;intensity&quot;:0.62,&quot;adjust&quot;:{&quot;exposure&quot;:0.04,&quot;contrast&quot;:0.08,&quot;highlights&quot;:-0.18,&quot;shadows&quot;:0.05,&quot;whites&quot;:0,&quot;blacks&quot;:-0.05,&quot;temperature&quot;:0.06,&quot;tint&quot;:0.02,&quot;vibrance&quot;:0.03,&quot;saturation&quot;:-0.03},&quot;details&quot;:{&quot;vignette&quot;:0.05,&quot;vignetteMidpoint&quot;:0.5,&quot;vignetteRoundness&quot;:0,&quot;vignetteFeather&quot;:0.65,&quot;grain&quot;:0,&quot;grainSize&quot;:0.25,&quot;grainRoughness&quot;:0.5},&quot;effects&quot;:{&quot;blur&quot;:0,&quot;pixelate&quot;:0,&quot;chromaBleed&quot;:0,&quot;tapeDamage&quot;:0,&quot;tapeTracking&quot;:0,&quot;tapeNoise&quot;:1,&quot;tapeSpeed&quot;:0.5,&quot;filmArtifacts&quot;:0,&quot;halftone&quot;:0,&quot;halftoneSize&quot;:0,&quot;twoInkPrint&quot;:0,&quot;twoInkPrintSize&quot;:0,&quot;ascii&quot;:0,&quot;asciiSize&quot;:0.06578947368421052,&quot;asciiInvert&quot;:0,&quot;asciiStyle&quot;:0,&quot;asciiColor&quot;:1,&quot;asciiRotation&quot;:0,&quot;dither&quot;:0,&quot;ditherSize&quot;:0,&quot;bloom&quot;:0,&quot;bloomRadius&quot;:8,&quot;monoScreen&quot;:0,&quot;monoScreenSize&quot;:0,&quot;monoScreenAngle&quot;:0,&quot;monoScreenSpread&quot;:0,&quot;monoScreenShape&quot;:0,&quot;monoScreenInvert&quot;:0,&quot;scanlines&quot;:0,&quot;scanlineCount&quot;:0,&quot;scanlineSoftness&quot;:0,&quot;chromaticAberration&quot;:0,&quot;chromaticAngle&quot;:0,&quot;crtCurvature&quot;:0,&quot;digitalGlitch&quot;:0,&quot;digitalGlitchColorSplit&quot;:0,&quot;digitalGlitchLineTear&quot;:0,&quot;digitalGlitchPixelate&quot;:0,&quot;digitalGlitchBlockAmount&quot;:0,&quot;digitalGlitchBlockDisplacement&quot;:0,&quot;digitalGlitchBlockOpacity&quot;:0,&quot;digitalGlitchSpeed&quot;:0,&quot;engraving&quot;:0,&quot;engravingSpacing&quot;:0.4117647058823529,&quot;engravingMinThickness&quot;:0.2,&quot;engravingMaxThickness&quot;:0.4571428571428572,&quot;engravingAngle&quot;:0.25,&quot;engravingContrast&quot;:0.4666666666666667,&quot;engravingSharpness&quot;:0.59,&quot;engravingWave&quot;:0.2,&quot;engravingWaveFrequency&quot;:0.2222222222222222,&quot;crosshatch&quot;:0,&quot;crosshatchSpacing&quot;:0.28,&quot;crosshatchThickness&quot;:0.25,&quot;crosshatchAngle&quot;:0.25,&quot;crosshatchContrast&quot;:0.3333333333333333,&quot;crosshatchEdges&quot;:0.5,&quot;crosshatchLineWeight&quot;:0,&quot;crosshatchWave&quot;:0.33,&quot;crosshatchWaveFrequency&quot;:0.2222222222222222,&quot;kuwahara&quot;:0,&quot;kuwaharaRadius&quot;:0.14285714285714285,&quot;kuwaharaSharpness&quot;:0.3125,&quot;kuwaharaSaturation&quot;:0.5},&quot;lut&quot;:null,&quot;colorSpace&quot;:&quot;rec709&quot;}" id="pvv-example" class="clip" src="assets/aroll-cut.mp4" data-start="20.0" data-duration="8.0" data-media-start="20.0" data-track-index="8" playsinline muted style="left: -349px; top: -205px; width: 1300px; height: 731px"></video>
        </div>
        <div id="endfade" style="position: absolute; inset: 0; background: #0b0b0b; opacity: 0; pointer-events: none"></div>
      </div>
      <!-- SFX: one soft sound per visible state change (references/05). Spread over tracks 10/11/13/14 (short) and 12/15 (long); never past the end. e.g.
      <audio id="sfx-01" src="assets/sfx/whoosh-short.mp3" data-start="0.00" data-duration="0.57" data-track-index="10" data-volume="0.18"></audio>
      <audio id="sfx-02" src="assets/sfx/click-soft.mp3" data-start="1.28" data-duration="0.37" data-track-index="11" data-volume="0.1"></audio>
      The music bed (assets/music/score.wav) is added by the user's music pipeline. -->
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const SH = window.HFKit.SHOTS;
      const pose = (f) => ({ scale: f.s, x: f.X, y: f.Y });
      tl.set("#cam", { transformOrigin: "720px 540px" }, 0);

      /* Every shot: arrive tight (cut / whip / rack-focus / animated reframe), then one continuous dolly-out. */
      const keys = Object.keys(SH).sort((a, b) => SH[a].t - SH[b].t);
      keys.forEach((key, i) => {
        const sh = SH[key];
        // the last shot runs to the end of the video unless it names its own `end`
        const end = sh.end != null ? sh.end : i + 1 < keys.length ? SH[keys[i + 1]].t : parseFloat(document.getElementById("stage").dataset.duration);
        let settle = 0.1;
        if (sh.in === "move") {
          const prev = SH[keys[i - 1]].b;
          const nx = sh.a;
          const midS = Math.max(1.17, Math.min(prev.s, nx.s) - 0.16); // keep enough overscan for the 3D swing
          const dx = Math.sign(nx.sx - prev.sx);
          const dy = Math.sign(nx.sy - prev.sy);
          const d = sh.d || 1.2;
          const rx = Math.abs(nx.sy - prev.sy) > 60 ? -dy * 2 : 0;
          tl.to("#cam", { x: nx.X, y: nx.Y, duration: d, ease: "sine.inOut" }, sh.t);
          tl.to("#cam", { keyframes: [{ scale: midS, duration: d * 0.5, ease: "sine.inOut" }, { scale: nx.s, duration: d * 0.5, ease: "sine.inOut" }] }, sh.t);
          tl.to("#cam", { keyframes: [{ rotationY: dx * 2.5, rotationX: rx, duration: d * 0.5, ease: "sine.inOut" }, { rotationY: 0, rotationX: 0, duration: d * 0.5, ease: "sine.inOut" }] }, sh.t);
          settle = d;
        } else if (sh.in === "whip") {
          tl.set("#cam", Object.assign(pose(sh.a), { scale: sh.a.s * 1.12, filter: "blur(14px)" }), sh.t);
          tl.to("#cam", Object.assign(pose(sh.a), { filter: "blur(0px)", duration: 0.75, ease: "expo.out" }), sh.t);
          settle = 0.75;
        } else if (sh.in === "rack") {
          tl.set("#cam", Object.assign(pose(sh.a), { rotationY: 0, rotationX: 0, filter: "blur(16px)" }), sh.t);
          tl.to("#cam", { filter: "blur(0px)", duration: 0.45, ease: "power2.out" }, sh.t + 0.15);
          settle = 0.6;
        } else {
          // hard cut with a two-frame shutter smear so the jump reads as an edit, not a glitch
          tl.set("#cam", Object.assign(pose(sh.a), { rotationY: 0, rotationX: 0, filter: "blur(4px)" }), sh.t);
          tl.to("#cam", { filter: "blur(0px)", duration: 0.08, ease: "none" }, sh.t);
        }
        tl.set("#cam", { filter: "none" }, sh.t + settle + 0.01);
        tl.to("#cam", Object.assign(pose(sh.b), { duration: Math.max(0.2, end - sh.t - settle - 0.04), ease: "sine.inOut" }), sh.t + settle + 0.02);
      });

      /* ---------- face tracking: the camera follows your face ----------
         TRACK = [[t, dx, dy], …] (world px, 10 per second): how far to move the footage so your face goes back
         toward where each shot frames it (written by `modal run tools/hfcloud.py::track`). Every offset is clamped
         to the overscan the camera has at that moment, so the edge of the footage never shows. */
      /*TRACK:start*/ const TRACK = []; /*TRACK:end*/
      (function () {
        if (!TRACK.length) return;
        const D = parseFloat(document.getElementById("stage").dataset.duration);
        const sine = (u) => 0.5 - 0.5 * Math.cos(Math.PI * Math.min(1, Math.max(0, u)));
        const mix = (a, b, u) => ({ s: a.s + (b.s - a.s) * u, X: a.X + (b.X - a.X) * u, Y: a.Y + (b.Y - a.Y) * u });
        const REST = { s: 1, X: 0, Y: 0 };
        // the camera's pose at time t, mirroring the shot tweens above (cuts, racks, swings, dolly-outs, scene rests)
        function poseAt(t) {
          let i = keys.length - 1;
          while (i > 0 && SH[keys[i]].t > t) i--;
          const sh = SH[keys[i]];
          const end = sh.end != null ? sh.end : i + 1 < keys.length ? SH[keys[i + 1]].t : D;
          if (t > end) return REST; // a full-screen scene covers the frame; the camera rests at 1x
          let settle = 0.1,
            extra = 0;
          if (sh.in === "move") {
            const prev = SH[keys[i - 1]].b,
              d = sh.d || 1.2;
            settle = d;
            if (t < sh.t + d) {
              const u = (t - sh.t) / d;
              const midS = Math.max(1.17, Math.min(prev.s, sh.a.s) - 0.16);
              const p = mix(prev, sh.a, sine(u));
              p.s = u < 0.5 ? prev.s + (midS - prev.s) * sine(u * 2) : midS + (sh.a.s - midS) * sine((u - 0.5) * 2);
              p.extra = 22; // the 3D swing tilts the plane: keep extra room
              return p;
            }
          } else if (sh.in === "whip") settle = 0.75;
          else if (sh.in === "rack") settle = 0.6;
          const u = (t - sh.t - settle) / Math.max(0.2, end - sh.t - settle);
          return mix(sh.a, sh.b, sine(u));
        }
        // how far the footage may move before its edge shows (footage spans x −240…1680, y 0…1080 in the plane)
        function room(p) {
          const L = 720 + (-720 - p.X) / p.s,
            R = 720 + (720 - p.X) / p.s,
            T = 540 + (-540 - p.Y) / p.s,
            B = 540 + (540 - p.Y) / p.s,
            m = 6 + (p.extra || 0);
          return { x0: R - 1680 + m, x1: L + 240 - m, y0: B - 1080 + m, y1: T - m };
        }
        const clamp = (v, a, b) => (a > b ? (a + b) / 2 : Math.max(a, Math.min(b, v)));
        const pts = TRACK.filter((p, k) => k % 2 === 0); // 5 keyframes per second
        let prev = null;
        pts.forEach(([t, dx, dy]) => {
          // the tightest room in a small window around t keeps the clamp from snapping at shot changes
          const rs = [t - 0.2, t, t + 0.2].map((x) => room(poseAt(Math.max(0, x))));
          const r = rs.reduce((a, b) => ({ x0: Math.max(a.x0, b.x0), x1: Math.min(a.x1, b.x1), y0: Math.max(a.y0, b.y0), y1: Math.min(a.y1, b.y1) }));
          const v = { x: clamp(dx, r.x0, r.x1), y: clamp(dy, r.y0, r.y1) };
          if (prev == null) tl.set(".trk", v, 0);
          else tl.to(".trk", Object.assign({ duration: t - prev, ease: "none" }, v), prev);
          prev = t;
        });
      })();

      /* ---------- punch-ins: on the words that carry the point, the camera leans in ~8% around your face ----------
         The face stays where the shot framed it (face tracking keeps it there), so the zoom never pushes it out of frame.
         Each punch is released at the next shot: instantly on a cut/rack, smoothly across a swing. */
      (function () {
        const F = window.HFKit.FACE;
        const PUNCH = [1.28, 8.78]; // EXAMPLE: the words that carry the point, ~one per 10–15 s
        const faceAt = (t) => {
          let i = keys.length - 1;
          while (i > 0 && SH[keys[i]].t > t) i--;
          const sh = SH[keys[i]];
          const end = sh.end != null ? sh.end : i + 1 < keys.length ? SH[keys[i + 1]].t : 999;
          const u = Math.min(1, Math.max(0, (t - sh.t) / Math.max(0.2, end - sh.t)));
          const p = { s: sh.a.s + (sh.b.s - sh.a.s) * u, X: sh.a.X + (sh.b.X - sh.a.X) * u, Y: sh.a.Y + (sh.b.Y - sh.a.Y) * u };
          return { x: (F[0] - 720) * p.s + 720 + p.X, y: (F[1] - 540) * p.s + 540 + p.Y, next: i + 1 < keys.length ? SH[keys[i + 1]] : null, end };
        };
        PUNCH.forEach((t) => {
          const f = faceAt(t);
          tl.set("#punch", { transformOrigin: f.x.toFixed(1) + "px " + (f.y - 60).toFixed(1) + "px" }, t - 0.01);
          tl.to("#punch", { scale: 1.08, duration: 0.45, ease: "expo.out" }, t);
          const rel = f.next && f.next.t <= f.end + 0.01 ? f.next : null;
          if (rel && rel.in === "move") tl.to("#punch", { scale: 1, duration: rel.d || 1, ease: "sine.inOut" }, rel.t);
          else tl.set("#punch", { scale: 1 }, Math.min(f.end, rel ? rel.t : f.end));
        });
      })();

      /* rack focus into a frosted scene: the room (you, the sky, the trees) goes soft behind the glass, the camera
         settles under the blur, and focus pulls back onto you when the scene leaves (the next shot is a "rack") */
      function rack(t0, t1) {
        tl.set("#punch", { transformOrigin: "720px 540px" }, t0 - 0.01);
        tl.fromTo("#punch", { filter: "blur(0px) brightness(1) saturate(1)", scale: 1 }, { filter: "blur(30px) brightness(1.05) saturate(1.15)", scale: 1.12, duration: 0.6, ease: "power2.inOut", immediateRender: false }, t0);
        tl.to("#cam", { scale: 1, x: 0, y: 0, rotationY: 0, rotationX: 0, duration: 0.6, ease: "power2.inOut" }, t0);
        tl.to("#punch", { filter: "blur(0px) brightness(1) saturate(1)", scale: 1, duration: 0.55, ease: "power2.out" }, t1);
        tl.set("#punch", { filter: "none" }, t1 + 0.56);
      }
      rack(20.0, 28.0); // EXAMPLE: t0 = the shot before's `end`, t1 = the next shot (in: "rack")

      /* the live windows open with their scene's card and close with it */
      function portal(id, t0, t1) {
        tl.fromTo(id, { opacity: 0, scale: 0.9, y: 30, filter: "blur(12px)" }, { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 0.7, ease: "expo.out", immediateRender: false }, t0);
        tl.set(id, { filter: "none" }, t0 + 0.72);
        tl.to(id, { opacity: 0, scale: 0.96, filter: "blur(10px)", duration: 0.3, ease: "power1.in" }, t1 - 0.3);
      }
      portal("#pv-example", 20.2, 28.0);

      // ending: ease to black after the last word
      const D = parseFloat(document.getElementById("stage").dataset.duration);
      tl.fromTo("#endfade", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power1.in" }, D - 0.45);

      window.__timelines["main"] = tl;
    </script>
